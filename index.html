en:{h1:'Run & jump',h2:'Read & answer',h3:'Find the key',made:'Made for NIR Academy by',by:'Dr. Niki Majidi',play:'Play',levels:'Levels',resume:'Resume',restart:'Restart level',menu:'Main menu',cont:'Continue',listen:'Listen',hint:'Hint',ok:'Correct!',no:'Not quite — that does not match the text.',reset:'Reset progress',sure:'Delete all saved progress?',yes:'Yes, reset',cancel:'Cancel',sound:'Sound',music:'Music',retry:'Try again',next:'Next question',how:'Run, jump and collect books. Read at each lectern, answer the questions, find the golden key, then reach the gate.',pause:'Paused',mywords:'My words',nbempty:'Nothing here yet. Collect vocabulary tokens and review your mistakes here.',close:'Close'},
